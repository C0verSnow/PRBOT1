appId: com.prbot.desktop
productName: PRBOT
directories:
  app: .desktop/app
  output: release
files:
  - main.cjs
  - package.json
extraResources:
  - from: .desktop/server
    to: server
asar: true
npmRebuild: false
artifactName: PRBOT-${version}-${os}-${arch}.${ext}
mac:
  target: [dmg]
  category: public.app-category.developer-tools
  identity: null
  notarize: false
win:
  target: [nsis]
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [deb]
  category: Development
  executableName: prbot
  maintainer: PRBOT contributors <noreply@github.com>
